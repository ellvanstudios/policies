<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ellvan Studios — Policies</title>
  <meta name="description" content="Privacy policies and support pages for Ellvan Studios apps." />
  <style>
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5a5a;
      --border: #e4e4e7; --link: #2563eb; --card: #f7f7f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f11; --fg: #e8e8ea; --muted: #a1a1aa;
        --border: #2a2a2e; --link: #7aa2ff; --card: #17171a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 3.5rem 1.25rem 5rem; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { font-size: 2rem; margin: 0 0 .35rem; }
    .meta { color: var(--muted); margin: 0 0 2.5rem; }
    h2 { font-size: 1.15rem; margin: 2rem 0 .75rem; }
    .links { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
    .links li {
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); padding: .85rem 1.1rem;
    }
    footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Ellvan Studios</h1>
    <p class="meta">Privacy policies and support pages for our apps.</p>

    <h2>Figureland</h2>
    <ul class="links">
      <li><a href="/policies/figureland/privacy/">Privacy Policy</a></li>
      <li><a href="/policies/figureland/support/">Support</a></li>
    </ul>

    <h2>Voxel Builder</h2>
    <ul class="links">
      <li><a href="/policies/voxel-builder/privacy/">Privacy Policy</a></li>
      <li><a href="/policies/voxel-builder/support/">Support</a></li>
    </ul>

    <footer>Contact: <a href="mailto:ellvanstudios@gmail.com">ellvanstudios@gmail.com</a></footer>
  </main>
</body>
</html>
